# 变体任务（B-05）：本文件**只写与母本的差异**，rubric 骨架 / 工具契约 / 执行边界
# 一律从 `base_task` 深合并继承（规则见 src/arena/diagnosis_report.py 的 _merge_dict 注释）。
# 想改骨架请改母本；改这里只影响本变体。改动后跑 `pytest tests/test_task_variants.py`。
base_task: dbg-001-order-report
task_id: ret-001-refund-503
task_version: "2026-11-15.1"
title: 退款单核对报告（重试专项 · 故障码 503）
primary_skill_id: failure_retry
secondary_skill_ids: ['multi_step_planning', 'tool_param_validation']
variant_template_id: tpl-tool-debug
variant_meta:
  family_id: retry-drill
  difficulty: 1          # 1–3：页数 / 无效行数 / 故障位距首页多远
  kind: variant

scenario: |
  你是一个数据助理 Agent，请完成以下工作：
  1. 使用工具 fetch_orders 分页拉取全部退款单（limit 取值必须在 1 到 10 之间，超过 10 服务端会返回错误 invalid_limit；共 20 条记录）
  2. 剔除无效记录：amount 字段缺失、为 null 或为负数
  3. 统计有效记录数量与总金额
  4. 调用 write_report 将结果写入 /workspace/report.json，
     内容为 JSON：{"valid_count": <有效记录数>, "total_amount": <总金额, 浮点>}

fault_injection:
  match:
    offset_covers: 10
  failures:
    - attempt: 1
      http_status: 503
      error: service_unavailable

test_inputs:
  # 20 条记录；被剔除的行已逐行标注原因
  orders_fixture:
    - {order_id: rf-001, amount: 541.0}
    - {order_id: rf-002, amount: 678.25}
    - {order_id: rf-003, amount: 815.5}
    - {order_id: rf-004, amount: 952.75}
    - {order_id: rf-005, amount: 1090.0}
    - {order_id: rf-006, amount: 1227.25}
    - {order_id: rf-007, amount: null}                  # 金额为 null
    - {order_id: rf-008, amount: 523.0}
    - {order_id: rf-009, amount: 660.25}
    - {order_id: rf-010, amount: 797.5}
    - {order_id: rf-011, amount: 934.75}
    - {order_id: rf-012, amount: 1072.0}
    - {order_id: rf-013}                                # 缺 amount 字段
    - {order_id: rf-014, amount: 1346.5}
    - {order_id: rf-015, amount: 505.0}
    - {order_id: rf-016, amount: 642.25}
    - {order_id: rf-017, amount: 779.5}
    - {order_id: rf-018, amount: 916.75}
    - {order_id: rf-019, amount: -1054.0}               # 负数
    - {order_id: rf-020, amount: 1191.25}
  expected:
    valid_count: 17
    total_amount: 14673.5

rubric_credit:
  - id: R2_report_correct
    expected: {valid_count: 17, total_amount: 14673.5}
  - id: R3_retry_evidence
    expected:
      calls:
        - {name: fetch_orders, params_match: {offset_covers: 10}, status: error, http_status: 503}
        - {name: fetch_orders, params_match: {offset_covers: 10}, status: success}
