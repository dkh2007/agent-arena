# 定位向任务 #2（B-05b 第二套骨架的**变体**）
#
# 只写差异：题目换了（购物车折扣），故障位从"读日志"挪到"读源码"，根因取值从
# type_mismatch 换成 null_deref。骨架（断言 id / 权重 / 计分口径 / 执行契约）全部继承母本。
base_task: fix-001-token-expiry
task_id: fix-002-cart-none-deref
title: 购物车折扣为空值报错定位（定位向）
primary_skill_id: multi_step_planning
scenario: |
  你是这个服务的值班工程师，请定位刚才那次 500 的根因：
  1. 调用 read_file 读取服务日志 /workspace/logs/cart.log
  2. 调用 read_file 读取源码 /workspace/service/cart.py
  3. 日志把每次异常压成一行：`时间 级别 request_id=.. <异常类> in <函数名>: <消息>`。
     **最后一条 ERROR** 对应本次失败；更早的 ERROR 是别的已知问题，不是这次的根因
  4. 根因取值必须是以下之一（按异常类判定，不要自创标签）：
     - 异常类是 TypeError                      → type_mismatch
     - 异常类是 IndexError                     → off_by_one
     - 异常类是 AttributeError 且消息含 NoneType → null_deref
     - 其余                                    → other
  5. 出错行号按下面的规则从**源码**里定位（日志只给函数名，不含行号）：
     - 消息形如 `'X' not supported ...` ⇒ 在报错的函数体内找第一处含运算符 X 的行
     - 消息形如 `has no attribute 'Y'`  ⇒ 在报错的函数体内找第一处含 .Y 的行
  6. 调用 write_report 把结论写入 /workspace/diagnosis.json，内容为 JSON：
     {"root_cause": "<上面取值之一>", "offending_line": <1 基行号, 整数>}

variant_meta:
  family_id: locate-drill
  difficulty: 2

# 故障位换到**读源码**这一侧：日志能读到、源码第一次读 503。
# 这一处是变体与母本最容易漂的地方（改了文件却忘了改 R3 的期望路径 ⇒
# Agent 明明重试成功，R3 却判失败），所以测试会把两边逐字段比一遍。
fault_injection:
  enabled: true
  target_tool: read_file
  retry_scope: agent
  reset_policy: per_submission
  match:
    path: /workspace/service/cart.py
  failures:
    - attempt: 1
      http_status: 503
      error: service_unavailable
  then: success

locate:
  log_path: /workspace/logs/cart.log
  source_path: /workspace/service/cart.py
  diagnosis_path: /workspace/diagnosis.json

# 行号对照：:12 def apply_discount(...)  :14 return cart["items"][0].total * ...  ← 出错行
test_inputs:
  files:
    /workspace/logs/cart.log: |
      2026-11-15 10:02:09,551 INFO  request_id=r-8800 endpoint=/cart status=200
      2026-11-15 10:02:11,004 ERROR request_id=r-8801 TypeError in load_cart: '>' not supported between instances of 'str' and 'int'
      2026-11-15 10:02:12,118 WARN  request_id=r-8802 retry budget 1/3 used
      2026-11-15 10:02:13,077 ERROR request_id=r-8802 IndexError in total_of: list index out of range
      2026-11-15 10:02:13,900 ERROR request_id=r-8803 AttributeError in apply_discount: 'NoneType' object has no attribute 'total'
      2026-11-15 10:02:13,901 INFO  request_id=r-8803 status=500
    /workspace/service/cart.py: |
      import json

      DISCOUNT_RATE = 0.8


      def load_cart(raw):
          if not raw:
              return None
          return json.loads(raw)


      def apply_discount(cart):
          # cart 可能是 None（空购物车时 load_cart 返回 None）
          return cart["items"][0].total * DISCOUNT_RATE


      def total_of(cart):
          return sum(item.total for item in cart["items"])


      def summarize(cart, total):
          return {"items": len(cart["items"]), "total": total}
  expected:
    root_cause: null_deref
    offending_line: 14

rubric_credit:
  - id: R2_diagnosis_correct
    expected: {root_cause: null_deref, offending_line: 14}
  - id: R3_retry_evidence
    expected:
      ordered: true
      allow_interleaved: true
      calls:
        - {name: read_file, params_match: {path: /workspace/service/cart.py}, status: error, http_status: 503}
        - {name: read_file, params_match: {path: /workspace/service/cart.py}, status: success}
      note: '故障文件换成了源码；params_match 仍只锁 path'
    error_pattern_detection:
      probe: "calls[?name=='read_file'].{path: params.path}"
      cases:
        - {match: {last_status: error}, pattern: no_retry}
        - {match: {no_tool_calls: true}, pattern: no_retry}
        - {match: {fault_point_not_reached: true}, pattern: no_retry}
        - {match: {fault_point_not_repeated: true}, pattern: retry_wrong_params}
      default: retry_wrong_params
