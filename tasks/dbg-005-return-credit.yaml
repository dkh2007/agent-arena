    - {order_id: rtn-023, amount: 1191.25}
    - {order_id: rtn-024, amount: 1328.5}
  expected:
    valid_count: 19
    total_amount: 17915.5

rubric_credit:
  - id: R2_report_correct
    expected: {valid_count: 19, total_amount: 17915.5}
  - id: R3_retry_evidence
    expected:
      calls:
        - {name: fetch_orders, params_match: {offset_covers: 18}, status: error, http_status: 500}
        - {name: fetch_orders, params_match: {offset_covers: 18}, status: success}
