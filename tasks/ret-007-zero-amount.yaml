base_task: dbg-001-order-report
task_id: ret-007-zero-amount
task_version: "2026-11-22.1"
title: 零额退款核对报告（重试专项 · 含零额记录）
primary_skill_id: failure_retry
secondary_skill_ids: ['multi_step_planning', 'tool_param_validation']
variant_template_id: tpl-tool-debug
variant_meta:
  family_id: retry-drill
  difficulty: 2          # 24 行 / 每页 ≤10 ⇒ 3 页；改页数记得同步这一行
  kind: variant

scenario: |
  你是一个数据助理 Agent，请完成以下工作：
  客服后台刚导出了本月全部 24 条零额退款单（整单退货时退款金额就是 0）。
  1. 使用工具 fetch_orders 分页拉取全部退款单（limit 取值必须在 1 到 10 之间，
     超过 10 服务端会返回错误 invalid_limit；共 24 条记录）
  2. 剔除无效记录：amount 字段缺失、为 null 或为负数
     （金额恰好为 0 的记录**仍然有效**，0 不算负数）
  3. 统计有效记录数量与总金额
  4. 调用 write_report 将结果写入 /workspace/report.json，
     内容为 JSON：{"valid_count": <有效记录数>, "total_amount": <总金额, 浮点>}

fault_injection:
  match:
    offset_covers: 22
  failures:
    - attempt: 1
      http_status: 500
      error: internal_error

tools:
  - name: fetch_orders
    parameters:
      - name: offset
        type: integer
        required: true
        minimum: 0
      - name: limit
        type: integer
        required: true
        minimum: 1
        maximum: 10
    mock:
      pagination:
        page_size_max: 10

test_inputs:
  # 24 条记录，3 页；被剔除的行已逐行标注原因。
  orders_fixture:
    - {order_id: nw-001, amount: 112.5}
    - {order_id: nw-002, amount: 125.0}
    - {order_id: nw-003, amount: 0}          # 零额记录：0 不是负数，应计入有效
    - {order_id: nw-004, amount: 150.0}
    - {order_id: nw-005, amount: 162.5}
    - {order_id: nw-006, amount: 175.0}
    - {order_id: nw-007, amount: 187.5}
    - {order_id: nw-008}                        # 缺 amount 字段（第 8 条）
    - {order_id: nw-009, amount: 200.0}
    - {order_id: nw-010, amount: 212.5}
    - {order_id: nw-011, amount: 0}          # 零额记录：0 不是负数，应计入有效
    - {order_id: nw-012, amount: 237.5}
    - {order_id: nw-013, amount: 250.0}
    - {order_id: nw-014, amount: 262.5}
    - {order_id: nw-015, amount: 275.0}
    - {order_id: nw-016, amount: null}          # 金额为 null（第 16 条）
    - {order_id: nw-017, amount: 287.5}
    - {order_id: nw-018, amount: 300.0}
    - {order_id: nw-019, amount: 312.5}
    - {order_id: nw-020, amount: 325.0}
    - {order_id: nw-021, amount: 0}          # 零额记录：0 不是负数，应计入有效
    - {order_id: nw-022, amount: 350.0}
    - {order_id: nw-023, amount: 362.5}
    - {order_id: nw-024, amount: -362.5}        # 负数（第 24 条）
  expected:
    valid_count: 21
    total_amount: 4287.5

rubric_credit:
  - id: R2_report_correct
    expected: {valid_count: 21, total_amount: 4287.5}
  - id: R3_retry_evidence
    expected:
      calls:
        - {name: fetch_orders, params_match: {offset_covers: 22}, status: error, http_status: 500}
        - {name: fetch_orders, params_match: {offset_covers: 22}, status: success}
