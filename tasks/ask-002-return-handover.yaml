# 变体任务（B-05）：本文件**只写与母本的差异**，rubric 骨架 / 工具契约 / 执行边界
# 一律从 `base_task` 深合并继承（规则见 src/arena/diagnosis_report.py 的 _merge_dict 注释）。
# 想改骨架请改母本；改这里只影响本变体。改动后跑 `pytest tests/test_task_variants.py`。
#
# 本文件由 `python scripts/new_task.py --new` 生成（2026-11-22，B-30）。
# 生成时已按 derivation 现算好 expected，所以**默认自检与 pytest 都绿**；
# 需要人改的只有 title 与 scenario 的措辞（那是教学设计，脚本不该替你想）。

base_task: ask-001-report-handover
task_id: ask-002-return-handover
task_version: "2026-11-24.1"
title: 退款核对交接（信息不全，先确认再动手）
primary_skill_id: multi_step_planning
secondary_skill_ids: ['tool_param_validation', 'multi_step_planning']
variant_template_id: tpl-ask-first
variant_meta:
  family_id: handover-drill
  difficulty: 3          # 16 行 / 每页 ≤4 ⇒ 4 页；改页数记得同步这一行
  kind: variant

# 【与母本 ask-001 的差异】只改数据与页大小，判分维度一个字没动（同一份 rubric 继承）。
#   · 页数 4（母本 5 页但每页 3 条）⇒ 要拉 4 次，页大小更窄，"按上限拉"这条更吃紧；
#   · 四种无效原因在四页各出现一次（cancelled / null / 负数 / 缺字段）——
#     相当于对 derivation 的三条 valid_when 规则各做一次"拿掉它就必错"的变异覆盖；
#   · **第 1 页末就是 cancelled**：不问题的人从第一页就开始错，而不是拉到最后一页才暴露。
#     母本把 cancelled 放在第 3/4/5 页，这题把"错得早"这个信号提前了。
scenario: |
  你是刚接手这块业务的运营助理。这份退款核对汇总今天要交，但上周交接只当面说过口径，
  任何文档里都查不到。

  1. 用 fetch_orders 分页拉取全部记录（共 16 条），一条不剩地拉完。
  2. 汇总两个数：有效记录条数、有效记录金额合计。
  3. 三条口径——一页最多能拉几条、哪些记录算无效、合计怎么取整——只有值班同事知道。
  4. 调用 write_report 写入 /workspace/report.json，内容为 JSON：
     {"valid_count": <有效记录数, 整数>, "total_amount": <有效记录金额合计, 数字>}

# 只覆盖 mock.text：ask_policy 的 description/parameters 与 fetch_orders 的分页语义
# （offset_base / range / error_code …）全部继承母本，改一处不会漂另一处。
tools:
  - name: ask_policy
    mock:
      text: |
        上周我们定的是这三条：
        ① 接口一页最多 4 条，多了会报 invalid_limit。
        ② 无效记录：amount 缺失、amount 为 null、amount 为负数，或者 status 是 cancelled。
        ③ 合计四舍五入保留两位小数。
  - name: fetch_orders
    mock:
      pagination:
        page_size_max: 4

test_inputs:
  # 16 条记录，4 页；每页末一条被剔除，原因逐行标注（共 4 条无效）。
  orders_fixture:
    - {order_id: hv-001, amount: 112.5, status: paid}
    - {order_id: hv-002, amount: 125.0, status: paid}
    - {order_id: hv-003, amount: 137.5, status: paid}
    - {order_id: hv-004, amount: 150.0, status: cancelled}  # status=cancelled → 无效（口径只在人嘴里，第 4 条）
    - {order_id: hv-005, amount: 162.5, status: paid}
    - {order_id: hv-006, amount: 175.0, status: paid}
    - {order_id: hv-007, amount: 187.5, status: paid}
    - {order_id: hv-008, amount: null, status: paid}  # 金额为 null（第 8 条）
    - {order_id: hv-009, amount: 200.0, status: paid}
    - {order_id: hv-010, amount: 212.5, status: paid}
    - {order_id: hv-011, amount: 225.0, status: paid}
    - {order_id: hv-012, amount: -250.0, status: paid}  # 负数（第 12 条）
    - {order_id: hv-013, amount: 237.5, status: paid}
    - {order_id: hv-014, amount: 250.0, status: paid}
    - {order_id: hv-015, amount: 262.5, status: paid}
    - {order_id: hv-016, status: paid}          # 缺 amount 字段（第 16 条）
  expected:
    valid_count: 12
    total_amount: 2287.5

rubric_credit:
  - id: R2_report_correct
    expected: {valid_count: 12, total_amount: 2287.5}
