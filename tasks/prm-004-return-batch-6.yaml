# 一律从 `base_task` 深合并继承（规则见 src/arena/diagnosis_report.py 的 _merge_dict 注释）。
# 想改骨架请改母本；改这里只影响本变体。改动后跑 `pytest tests/test_task_variants.py`。
base_task: dbg-001-order-report
task_id: prm-004-return-batch-6
task_version: "2026-11-22.1"
title: 退货入库核对报告（参数专项 · 页上限 6）
primary_skill_id: tool_param_validation
secondary_skill_ids: ['multi_step_planning', 'failure_retry']
variant_template_id: tpl-tool-debug
variant_meta:
  family_id: param-surface
  difficulty: 2          # 3 页（18 行 / 上限 6），比 prm-003 的 5 页浅，故记 2
  kind: variant

scenario: |
  你是一个数据助理 Agent，请完成以下工作：
  1. 使用工具 fetch_orders 分页拉取全部退货入库单（limit 取值必须在 1 到 6 之间，超过 6 服务端会返回错误 invalid_limit；共 18 条记录）
  2. 剔除无效记录：amount 字段缺失、为 null 或为负数
  3. 统计有效记录数量与总金额
  4. 调用 write_report 将结果写入 /workspace/report.json，
     内容为 JSON：{"valid_count": <有效记录数>, "total_amount": <总金额, 浮点>}

fault_injection:
  match:
    offset_covers: 13
  failures:
    - attempt: 1
      http_status: 502
      error: bad_gateway

tools:
  - name: fetch_orders
    parameters:
      - name: offset
        type: integer
        required: true
        minimum: 0
      - name: limit
        type: integer
        required: true
        minimum: 1
        maximum: 6
    mock:
      pagination:
        page_size_max: 6

test_inputs:
  # 18 条记录；被剔除的行已逐行标注原因。上限 6 ⇒ 3 页；故障在第 14 条（第三页第 2 条）
  orders_fixture:
    - {order_id: rt-001, amount: 541.0}
    - {order_id: rt-002, amount: 678.25}
    - {order_id: rt-003}                                # 缺 amount 字段
    - {order_id: rt-004, amount: 815.5}
    - {order_id: rt-005, amount: null}                  # 金额为 null
    - {order_id: rt-006, amount: 1090.0}
    - {order_id: rt-007, amount: 1227.25}
    - {order_id: rt-008, amount: 1364.5}
    - {order_id: rt-009, amount: 523.0}
    - {order_id: rt-010, amount: -660.25}               # 负数
    - {order_id: rt-011, amount: 934.75}
    - {order_id: rt-012, amount: 1072.0}
    - {order_id: rt-013, amount: 1209.25}
    - {order_id: rt-014, amount: 1346.5}
    - {order_id: rt-015, amount: 642.25}
    - {order_id: rt-016, amount: null}                  # 金额为 null
    - {order_id: rt-017, amount: 779.5}
    - {order_id: rt-018, amount: 916.75}
  expected:
    valid_count: 14
    total_amount: 13140.5

rubric_credit:
  - id: R2_report_correct
    expected: {valid_count: 14, total_amount: 13140.5}
  - id: R3_retry_evidence
    expected:
      calls:
        - {name: fetch_orders, params_match: {offset_covers: 13}, status: error, http_status: 502}
        - {name: fetch_orders, params_match: {offset_covers: 13}, status: success}
    # error_pattern_detection 不写：母本 cases 已是相对谓词，与页大小、故障位置无关（B-31）
