# 变体任务（B-05）：本文件**只写与母本的差异**，rubric 骨架 / 工具契约 / 执行边界
# 一律从 `base_task` 深合并继承（规则见 src/arena/diagnosis_report.py 的 _merge_dict 注释）。
# 想改骨架请改母本；改这里只影响本变体。改动后跑 `pytest tests/test_task_variants.py`。
#
# 扩题（B-30，2026-11-28）：retry-drill 第 9 道，也是全库第一道**连续失败两次**的题。
#
# 此前 24 道带故障的题，`failures` 全部只有一条——第 1 次失败、第 2 次成功。
# 后果不是"题目重复"，是**判据从没被真正压迫过**：
#   · 学习者只要"重试一次"就能过全部题，形成"试一下就好"的习惯；
#   · `retry_exhausted`（重试预算用尽）这条错误模式从建库起只在手写夹具里出现过，
#     没有任何一道真任务能走到它——因为"预算 1 + 失败 1 次"与"完全不重试"在数值上不可区分。
# 这道题第 1、2 次都 503、第 3 次才成功，两个形态第一次能被分开：
#   完全不重试（retries=0）        → 只碰到故障点 1 次 ⇒ no_retry
#   试了但没试够（预算 1）          → 碰到 2 次、最后一次仍是 error ⇒ retry_exhausted
# 参考 Agent 的预算已定为固定 3（`reference_agent.DEFAULT_RETRIES`）：那是"合规客户端"的参数，
# 不该由题库里"故障只失败一次"这个巧合反向决定。
base_task: dbg-001-order-report
task_id: ret-009-consecutive-flaps
task_version: "2026-11-28.1"
title: 设备巡检记录核对报告（重试专项 · 连续抖动两次）
primary_skill_id: failure_retry
secondary_skill_ids: ['multi_step_planning', 'tool_param_validation']
variant_template_id: tpl-tool-debug
variant_meta:
  family_id: retry-drill
  # 难度按「要处理多少东西」算（页数 / 无效行数）：20 行 / 每页 ≤10 ⇒ 2 页，只能标 1。
  # 这道题真正加的是"要试几次"，那个维度 difficulty 字段不表达，别以为标 1 就是简单。
  difficulty: 1
  kind: variant

scenario: |
  你是一个数据助理 Agent，请完成以下工作：
  1. 使用工具 fetch_orders 分页拉取全部设备巡检记录（limit 取值必须在 1 到 10 之间，超过 10 服务端会返回错误 invalid_limit；共 20 条记录）
  2. 剔除无效记录：amount 字段缺失、为 null 或为负数
  3. 统计有效记录数量与总金额
  4. 调用 write_report 将结果写入 /workspace/report.json，
     内容为 JSON：{"valid_count": <有效记录数>, "total_amount": <总金额, 浮点>}

fault_injection:
  match:
    offset_covers: 10           # 与母本同位：第 10 条所在的那一页
  failures:
    - attempt: 1                # 第 1 次失败
      http_status: 503
      error: service_unavailable
    - attempt: 2                # 重试一次仍然失败——这道题的全部意义在这一行
      http_status: 503
      error: service_unavailable
  # then 继承母本的 success：第 3 次成功。

test_inputs:
  # 20 条记录，2 页（每页 ≤10）。3 条无效行分在两页里，两页都要剔除：
  # 第 1 页 1 条（ins-004 金额为 null），第 2 页 2 条（ins-011 缺字段 / ins-017 负数）。
  orders_fixture:
    - {order_id: ins-001, amount: 512.5}
    - {order_id: ins-002, amount: 78.25}
    - {order_id: ins-003, amount: 1040.0}
    - {order_id: ins-004, amount: null}                 # 金额为 null
    - {order_id: ins-005, amount: 265.75}
    - {order_id: ins-006, amount: 903.5}
    - {order_id: ins-007, amount: 147.0}
    - {order_id: ins-008, amount: 631.25}
    - {order_id: ins-009, amount: 89.75}
    - {order_id: ins-010, amount: 412.0}
    - {order_id: ins-011}                               # 缺 amount 字段
    - {order_id: ins-012, amount: 1567.5}
    - {order_id: ins-013, amount: 324.25}
    - {order_id: ins-014, amount: 58.0}
    - {order_id: ins-015, amount: 745.75}
    - {order_id: ins-016, amount: 213.5}
    - {order_id: ins-017, amount: -96.25}               # 负数
    - {order_id: ins-018, amount: 880.0}
    - {order_id: ins-019, amount: 102.75}
    - {order_id: ins-020, amount: 496.5}
  expected:
    valid_count: 17
    total_amount: 8468.25

rubric_credit:
  - id: R2_report_correct
    expected: {valid_count: 17, total_amount: 8468.25}
  - id: R3_retry_evidence
    # 三步而不是两步：失败、失败、成功。
    # 判定仍是「子序列 + 允许穿插」（继承母本的 ordered / allow_interleaved），
    # 所以"失败后先补一页、再回来重试这一页"同样算数——顺序不同不该被判没重试。
    expected:
      calls:
        - {name: fetch_orders, params_match: {offset_covers: 10}, status: error, http_status: 503}
        - {name: fetch_orders, params_match: {offset_covers: 10}, status: error, http_status: 503}
        - {name: fetch_orders, params_match: {offset_covers: 10}, status: success}
      note: '两步连续失败后成功：只重试一次的人拿不到这一页，而"试了但没试够"应判 retry_exhausted、不该混进 no_retry'
