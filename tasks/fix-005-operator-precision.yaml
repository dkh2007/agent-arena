# 定位向任务 #5（B-05b 第二套骨架的**变体**）
#
# 只写差异：业务换成配额校验，根因仍是 type_mismatch，但**定位特征从 `<` 换成 `>=`**，
# 而源码的同一个函数里 `<` 与 `>=` 相邻共存 —— 只看"有没有比较符"会落到上一行。
# 骨架（断言 id / 权重 / 计分口径 / 执行契约）全部继承母本。
#
# 本文件由 `python scripts/new_task.py --new` 起骨架、手工改写成上面这个考点
# （2026-11-22，B-30）。生成器的定位模板只给 off_by_one，而参考 Agent 的定位器
# 只认运算符与属性名两类特征，IndexError 不可定位（见 docs/BACKLOG.md B-30 记录）。
base_task: fix-001-token-expiry
task_id: fix-005-operator-precision
title: 配额校验报错定位（定位向 · 运算符精确匹配）
primary_skill_id: multi_step_planning
scenario: |
  你是这个服务的值班工程师，请定位刚才那次 500 的根因：
  1. 调用 read_file 读取服务日志 /workspace/logs/quota.log
  2. 调用 read_file 读取源码 /workspace/service/quota_checker.py
  3. 日志把每次异常压成一行：`时间 级别 request_id=.. <异常类> in <函数名>: <消息>`。
     **最后一条 ERROR** 对应本次失败；更早的 ERROR 是别的已知问题，不是这次的根因
  4. 根因取值必须是以下之一（按异常类判定，不要自创标签）：
     - 异常类是 TypeError                      → type_mismatch
     - 异常类是 IndexError                     → off_by_one
     - 异常类是 AttributeError 且消息含 NoneType → null_deref
     - 其余                                    → other
  5. 出错行号按下面的规则从**源码**里定位（日志只给函数名，不含行号）：
     - 消息形如 `'X' not supported ...` ⇒ 在报错的函数体内找第一处含运算符 X 的行。
       **X 是消息里出现的那个运算符本身**：`'>' not supported` 找 `>`，
       `'>=' not supported` 找 `>=`，两者不能互相顶替
     - 消息形如 `has no attribute 'Y'`  ⇒ 在报错的函数体内找第一处含 .Y 的行
  6. 调用 write_report 把结论写入 /workspace/diagnosis.json，内容为 JSON：
     {"root_cause": "<上面取值之一>", "offending_line": <1 基行号, 整数>}

variant_meta:
  family_id: locate-drill
  difficulty: 3

# 故障位在读源码这一侧（日志能读到、源码第一次读 503），与 fix-002 同侧。
fault_injection:
  enabled: true
  target_tool: read_file
  retry_scope: agent
  reset_policy: per_submission
  match:
    path: /workspace/service/quota_checker.py
  failures:
    - attempt: 1
      http_status: 503
      error: service_unavailable
  then: success

locate:
  log_path: /workspace/logs/quota.log
  source_path: /workspace/service/quota_checker.py
  diagnosis_path: /workspace/diagnosis.json

# 行号对照：
#   :8  def check_quota(used, limit):
#   :9      if used < limit:          ← 干扰行：同样含比较符，但是 `<` 不是 `>=`
#   :11     if used >= limit:         ← 真因所在行
test_inputs:
  files:
    /workspace/logs/quota.log: |
      2026-11-22 08:40:01,110 INFO  request_id=q-7001 endpoint=/quota status=200
      2026-11-22 08:40:02,470 ERROR request_id=q-7002 IndexError in first_bucket: list index out of range
      2026-11-22 08:40:03,015 INFO  request_id=q-7003 reload config generation=42
      2026-11-22 08:40:04,880 ERROR request_id=q-7004 TypeError in merge_limits: '<' not supported between instances of 'dict' and 'int'
      2026-11-22 08:40:05,120 WARN  request_id=q-7004 retry budget 1/3 used
      2026-11-22 08:40:06,340 ERROR request_id=q-7005 AttributeError in render_badge: 'NoneType' object has no attribute 'label'
      2026-11-22 08:40:07,900 ERROR request_id=q-7006 TypeError in check_quota: '>=' not supported between instances of 'str' and 'int'
      2026-11-22 08:40:07,905 INFO  request_id=q-7006 status=500
    /workspace/service/quota_checker.py: |
      LIMIT = 100


      def normalize(raw):
          return int(raw)


      def check_quota(used, limit):
          if used < limit:
              return "ok"
          if used >= limit:
              return "over"
          return "unknown"


      def first_bucket(buckets):
          return buckets[0]


      def summarize(used, limit):
          return {"used": used, "limit": limit, "state": check_quota(used, limit)}
  expected:
    root_cause: type_mismatch
    offending_line: 11

rubric_credit:
  - id: R2_diagnosis_correct
    expected: {root_cause: type_mismatch, offending_line: 11}
  - id: R3_retry_evidence
    expected:
      ordered: true
      allow_interleaved: true
      calls:
        - {name: read_file, params_match: {path: /workspace/service/quota_checker.py}, status: error, http_status: 503}
        - {name: read_file, params_match: {path: /workspace/service/quota_checker.py}, status: success}
      note: '故障在读源码这一侧；params_match 仍只锁 path'
