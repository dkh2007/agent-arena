    - {order_id: so-011, amount: 934.75}
    - {order_id: so-012}                                # 缺 amount 字段
    - {order_id: so-013, amount: 1209.25}
    - {order_id: so-014, amount: 1346.5}
    - {order_id: so-015, amount: 505.0}
