# 想改骨架请改母本；改这里只影响本变体。改动后跑 `pytest tests/test_task_variants.py`。
base_task: dbg-001-order-report
task_id: ret-002-second-page-fault
task_version: "2026-11-15.1"
title: 销售订单核对报告（重试专项 · 故障在第三页）
primary_skill_id: failure_retry
secondary_skill_ids: ['multi_step_planning', 'tool_param_validation']
variant_template_id: tpl-tool-debug
variant_meta:
  family_id: retry-drill
  difficulty: 2          # 1–3：页数 / 无效行数 / 故障位距首页多远
  kind: variant

scenario: |
  你是一个数据助理 Agent，请完成以下工作：
  1. 使用工具 fetch_orders 分页拉取全部销售订单（limit 取值必须在 1 到 10 之间，超过 10 服务端会返回错误 invalid_limit；共 40 条记录）
  2. 剔除无效记录：amount 字段缺失、为 null 或为负数
  3. 统计有效记录数量与总金额
  4. 调用 write_report 将结果写入 /workspace/report.json，
     内容为 JSON：{"valid_count": <有效记录数>, "total_amount": <总金额, 浮点>}

fault_injection:
  match:
    offset: 20
  failures:
    - attempt: 1
      http_status: 500
      error: internal_error

test_inputs:
  # 40 条记录；被剔除的行已逐行标注原因
  orders_fixture:
    - {order_id: so-001, amount: 541.0}
    - {order_id: so-002, amount: 678.25}
    - {order_id: so-003, amount: 815.5}
    - {order_id: so-004, amount: null}                  # 金额为 null
    - {order_id: so-005, amount: 1090.0}
