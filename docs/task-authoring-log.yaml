# 加题台账（2026-11-22，B-30 扩题前置）
#
# ── 这个文件为什么存在 ────────────────────────────────────────────────────
# 加一道题原来要手改三处 Python 常量（tests/test_task_variants.py 的 `== 20`、
# tests/test_derivation.py 的 `== 16`、tests/test_lab.py 的三处 `== 20`）。
# 那些数字是**故意**写死的——`docs/authoring-tasks.md` §3 原文：「逼你在加题时停下来
# 确认这题真的独立、不是复制粘贴」。但"停下来想"这件事，靠改一个数字是逼不出来的：
# 数字改大就行，不需要任何判断。而且改数字这件事本身没有信息量，机器完全能自己算。
#
# 所以把闸门换个位置：**每加一道题，必须在这里写一句 why**——说清"这题变的是什么"。
# 数量不再由人声明（由行数决定），判断仍由人做（写在 why 里，留痕、可 review）。
#
# ── 校验在 tests/test_task_authoring.py ──────────────────────────────────
# ① 磁盘 tasks/*.yaml 的 id 集合与台账 id 集合必须**双向相等**（少一行 = 加题没登记；
#    多一行 = 题被删了但台账没跟；两种都红）；
# ② why 非空、去空白后 ≥ 12 字、不得是「同上」「见上」「略」「新题」这类占位；
# ③ why 里若提到数字（页数/条数/故障位），必须能在该题 YAML 里找到依据——
#    这条不做机器校验（自然语言），但写的时候请对着 YAML 抄，别凭印象。
#
# ── 加题流程 ─────────────────────────────────────────────────────────────
#   python scripts/new_task.py --family retry-drill --id ret-007-xxx --title "……"
#   它会：从母本复制骨架 → 填好家族/技能/骨架 → **自动在下面追加一行 why 占位** →
#         立刻跑单题自检并把「还差什么」打出来。
# 手写也行，写完必须跑 `python scripts/new_task.py --check tasks/xxx.yaml`。

tasks:
  # ── 汇报族 order-report（骨架 tpl-tool-debug，主技能 multi_step_planning）──
  - id: dbg-001-order-report
    why: 母本。20 行 / 每页 10 / 故障在第 11 条，汇报族其余题的骨架、断言、权重都从它继承。
  - id: dbg-002-invoice-report
    why: 业务域换成发票、故障码 500→503——验证"只换域与码、骨架不动"时判分仍可比。
  - id: dbg-003-purchase-report
    why: 30 行 3 页、故障仍在第 10 条（继承母本）：页数变多而故障位置不变，考「重试后还要拉完剩下两页」。
  - id: dbg-004-sensor-batch
    why: 40 行 4 页、故障仍在第 10 条：页数加到 4 页而故障留在第一页末尾，重试后要连拉 3 页才算完。
  - id: dbg-005-return-credit
    why: 24 行 3 页、故障在第 19 条。此前汇报族故障都在第 10/11 条（第一页末尾），这是第一次挪到第二页中段。
  - id: dbg-006-stock-diff-audit
    why: 34 行 4 页、故障在第 28 条：故障落在第三页中段，且该页还有无效行——重拉该页才算对。
  - id: dbg-007-first-fault
    why: 25 行 3 页、故障在第 1 条：全库故障位都在第 5 条之后，这是唯一开局即失败的题；无效行密度 1/3 也是全库最高（每页都有 3 条要剔）
  # ── 定位族 locate-drill（骨架 tpl-bug-locate，主技能 multi_step_planning）──
  - id: fix-001-token-expiry
    why: 定位族母本。日志里 20 条 ERROR、真因是第 20 行的类型不匹配，其余定位题从它继承骨架。
  - id: fix-002-cart-none-deref
    why: 判据换成空值解引用（null_deref），且主现场是源码文件而非日志——定位题第一次不以日志为中心。
  - id: fix-003-tz-window-mismatch
    why: 判据是时区窗口（跨日边界）：同一错误在日志里反复出现，要分开噪声与真因。
  - id: fix-004-cache-lost-update
    why: 判据落到"其他"（缓存丢更新），主现场在缓存模块——四条线索互相矛盾，是定位族最深的一档。
  - id: fix-005-operator-precision
    why: 根因仍是 type_mismatch，但定位特征换成 >=，而同一函数里相邻行就有 <：只看「有没有比较符」会落到上一行，把「特征要精确匹配」第一次变成可扣分的点
  # ── 参数族 param-surface（骨架 tpl-tool-debug，主技能 tool_param_validation）──
  - id: prm-001-page-ceiling-5
    why: 页上限收到 5（母本是 10）：参数校验从"传个大数"变成"先读题面再定 limit"，超限直接报 invalid_limit。
  - id: prm-002-ceiling-5-long
    why: 同为上限 5 但 30 行 6 页：同样约束下页数翻倍，测的是"上限有没有坚持到底"而不是只试一次。
  - id: prm-003-page-ceiling-4
    why: 上限收到 4、20 行要翻 5 页：上限越窄页数越多，越容易图省事直接传 10。
  - id: prm-004-return-batch-6
    why: 上限 6 且故障 502 在第 14 条：参数约束与故障重试叠加——重试那一次也必须守住上限。
  - id: prm-005-page-ceiling-3
    why: 20 行 / 每页 ≤3 / 7 页：上限从 6 一路降到 3，成为全库最窄；页数 7 也最多，守上限这件事要重复 7 次而不是 2 次
  # ── 重试族 retry-drill（骨架 tpl-tool-debug，主技能 failure_retry）──
  - id: ret-001-refund-503
    why: 重试族基准。503 在第 11 条，第一次失败、第二次原参数成功——"同一个请求再来一次"的最小形态。
  - id: ret-002-second-page-fault
    why: 故障挪到第 21 条（第三页）：要先翻过一整页才遇到失败，与 ret-001 的"一上来就失败"区分开。
  - id: ret-003-fourth-page-fault
    why: 故障在第 31 条（第四页）：失败前已拉了 3 页，重试后还有 2 页——失败位置越靠后，丢页代价越大。
  - id: ret-004-narrow-page
    why: 上限 5 且故障在第 21 条：上限收窄后"第几条"与"第几页"不再对齐，重试必须用同一 limit。
  - id: ret-005-export-poll
    why: 25 行 3 页、故障在第 23 条且该页还有一条无效行：失败后不把这一页重拉完，就会少算 1 条。
  - id: ret-006-recon-page4
    why: 33 行 4 页、故障在第 32 条（倒数第二页末尾）：重试后只剩一页，容易误判"已经拉完"。
  - id: ret-007-zero-amount
    why: 24 行 3 页、故障在第 22 条，且放入 3 条 amount=0 的记录：全库没有题考过 0 这个边界，把规则写成「大于 0」就会少算这 3 条——剔除规则的宽窄第一次真的影响分数
  # ── 交接族 handover-drill（骨架 tpl-ask-first，主技能 multi_step_planning）──
  - id: ask-001-report-handover
    why: 第三套骨架母本。14 行 / 每页 3 / 三条口径（页大小、无效判定含 status=cancelled、取整）只在 ask_policy 的答复里，且刻意不注入故障。全库第一次有题考"先确认再动手"：不问就猜会少剔 3 条 cancelled（8/628.64 → 11/1598.64），而最后一页也放了无效行，逼每页都按规则看一遍
  - id: ask-002-return-handover
    why: 16 行 / 每页 4 / 4 页：页数最多的一档（d3），且第 1 页末就是 cancelled——不问口径的人从第一页就开始错，不是最后一页才暴露。四种无效原因（cancelled / null / 负数 / 缺字段）在四页各出现一次，mutation 式地覆盖 derivation 的每一条规则
  - id: ask-003-monthly-recon
    why: 13 行 / 每页 5 / 3 页（末页只 3 条）：与 ask-002 的整数页互补——拉到底时要处理「offset=10 返回 3 条、offset=13 返回空」的收尾，早停一页就少统计。无效行是 cancelled / null / 负数三种，不含缺字段，用来验证 derivation 的规则可以被单条违反而不连带其它
  - id: ask-004-duplicate-export
    why: 交接族第一次让 derivation.distinct_by 真的起作用：dv-002 与 dv-009 各出现两次、两次跨页（第 2/8 行、第 10/18 行），口径第 ③ 条「同一单号只算一次」只在 ask_policy 答复里。此前 26 道题 id 全唯一，那条声明一直空转。不去重会报 14/4568.24（正确 12/3707.74），R2 两个字段一起错——"不问"的代价因此比前两题大一档。18 行 / 每页 4 ⇒ 5 页，末页含一条缺字段的无效行
